[platformio]
src_dir = src

[env:espclock4]
board = wemos_d1_mini32
framework = arduino
platform = platformio/espressif32 @ ^7.1.3
platform_packages = framework-arduinoespressif32 @ https://github.com/cydia2020/framework-arduinoespressif32.git
board_build.arduino.upstream_packages = no
extra_scripts = ./littlefsbuilder.py
lib_deps = 
  arcao/Syslog @ ^2.0.0
  bblanchon/ArduinoJson @ ^7.4.3
  alanswx/ESPAsyncWiFiManager @ ^0.31
  ESP32Async/ESPAsyncWebServer @ ^3.12.1
upload_speed = 460800
monitor_speed = 115200
