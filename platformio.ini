[platformio]
src_dir = src

[env:espclock4]
board = esp32dev
framework = espidf, arduino
platform = espressif32
extra_scripts = ./littlefsbuilder.py
lib_deps = 
  arcao/Syslog @ ^2.0.0
  bblanchon/ArduinoJson @ ^7.4.3
  alanswx/ESPAsyncWiFiManager @ ^0.31
  ESP32Async/ESPAsyncWebServer @ ^3.12.1
upload_speed = 460800
monitor_speed = 115200
